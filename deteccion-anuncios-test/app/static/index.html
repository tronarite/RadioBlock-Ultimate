<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Detector — Test</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e37; --text: #e6e8ec;
    --muted: #8b909c; --accent: #4f8cff; --ok: #35c47a; --danger: #ef5c5c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.4; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.1rem; margin: 0; }
  main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .radio-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  .radio-head h2 { font-size: 1.05rem; margin: 0; color: var(--text); text-transform: none; letter-spacing: normal; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.ok { background: rgba(53,196,122,0.15); color: var(--ok); }
  .badge.bad { background: rgba(239,92,92,0.15); color: var(--danger); }
  .stat-mini { font-size: 0.85rem; color: var(--muted); }
  .grupo { border-top: 1px solid var(--border); padding: 0.8rem 0; }
  .grupo:first-child { border-top: none; }
  .grupo-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
  .badge-anuncio { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: rgba(239,92,92,0.15); color: var(--danger); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }
  button { cursor: pointer; background: #1d212b; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.6rem; font-size: 0.85rem; }
  button:hover { opacity: 0.85; }
  .apariciones-list { margin-top: 0.6rem; display: none; }
  .apariciones-list.open { display: block; }
  .apariciones-list .row { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.6rem 0; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .apariciones-list .row:last-child { border-bottom: none; }

  /* Reproductor propio: grande, barra fácil de arrastrar, marca visual
     del tramo estimado sin cortar nunca la reproducción del audio
     completo (el usuario decide si saltar ahí o no). */
  .player { display: flex; align-items: center; gap: 0.75rem; margin: 0.6rem 0; padding: 0.6rem 0.75rem; background: #10131a; border: 1px solid var(--border); border-radius: 8px; }
  .player audio { display: none; }
  .play-btn { flex: 0 0 auto; width: 2.4rem; height: 2.4rem; border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; padding: 0; }
  .seek-wrap { position: relative; flex: 1 1 auto; height: 1.6rem; display: flex; align-items: center; }
  .seek { width: 100%; height: 1.6rem; margin: 0; appearance: none; background: transparent; cursor: pointer; }
  .seek::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: #2a2e37; }
  .seek::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid #fff2; cursor: pointer; }
  .seek::-moz-range-track { height: 6px; border-radius: 999px; background: #2a2e37; }
  .seek::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #fff2; cursor: pointer; }
  .seek-marker { position: absolute; top: 50%; height: 6px; transform: translateY(-50%); background: rgba(239,92,92,0.55); border-radius: 999px; pointer-events: auto; cursor: pointer; }
  .player .time { flex: 0 0 auto; font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--muted); min-width: 5.5rem; text-align: right; }
</style>
</head>
<body>

<header>
  <h1>Ad Detector — proyecto de prueba</h1>
  <span class="muted" id="estado-global">cargando…</span>
</header>

<main id="radios-container">
  <p class="empty">Cargando emisoras…</p>
</main>

<script src="/static/app.js"></script>
</body>
</html>

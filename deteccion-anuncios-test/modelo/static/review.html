<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisión de anuncios</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--ink:#20242a;--muted:#606973;--line:#d8dde4;--yes:#0b7a48;--no:#a52c2c;--accent:#245baa}
    @media(prefers-color-scheme:dark){:root{--bg:#15171a;--card:#202329;--ink:#eef1f4;--muted:#aeb6c1;--line:#3a4049;--yes:#39ad74;--no:#ed7474;--accent:#8bb7ff}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}.top,main{max-width:760px;margin:auto}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px}.stats{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.stats b{color:var(--ink)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:.65rem .85rem}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}main{padding:0 16px 28px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px #0000000a}.progress{color:var(--muted);margin:0 0 14px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 20px}.meta div{border-left:3px solid var(--line);padding-left:9px}.meta small{display:block;color:var(--muted)}.audio-wrap{position:relative;margin:18px 0}.real{position:absolute;left:20%;width:60%;height:5px;top:calc(100% + 2px);background:var(--accent);border-radius:4px;pointer-events:none}.hint{font-size:.84rem;color:var(--muted);margin:6px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.actions button{font-size:1.08rem;font-weight:650;padding:1rem}.yes{background:var(--yes);color:white;border-color:transparent}.no{background:var(--no);color:white;border-color:transparent}.secondary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.grow{flex:1}.check{display:flex;gap:9px;align-items:center;margin:17px 0;color:var(--muted)}.borders{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.border-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:8px 0}.message{text-align:center;padding:42px 15px;color:var(--muted)}.timeline{position:relative;height:22px;margin-top:12px;background:var(--line);border-radius:6px}.timeline .tr{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.35;border-radius:6px}.cut{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--no);border:0;padding:0;border-radius:3px;cursor:pointer}.subs{display:flex;flex-direction:column;gap:6px;margin-top:12px}.sub{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:.4rem .6rem;font-size:.92rem}.hidden{display:none}@media(max-width:430px){.top{align-items:flex-start}.meta{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.top button{font-size:.85rem;padding:.5rem}}
  </style>
</head>
<body>
  <header class="top"><div class="stats"><span>Anuncios <b id="ads">—</b></span><span>No anuncios <b id="noads">—</b></span><span>Pendientes <b id="pending">—</b></span></div><button id="new">Pedir otra tanda</button></header>
  <main><section id="empty" class="message">Cargando tanda…</section><article id="card" class="card hidden">
    <p id="progress" class="progress"></p><div class="meta" id="meta"></div>
    <div class="audio-wrap"><audio id="audio" controls preload="metadata"></audio><div id="real" class="real" title="Tramo real (el resto son 3 s de margen)"></div></div><p class="hint">La marca azul indica el tramo real; el audio incluye 3 s antes y después.</p>
    <div class="timeline" id="timeline" title="Los cortes (rojo) separan cuñas dentro del bloque; clic en uno para quitarlo"><div class="tr" id="tr"></div></div><div class="subs" id="subs"></div>
    <label class="check"><input id="propagate" type="checkbox"> Aplicar a todas las repeticiones del mismo audio</label>
    <div class="actions"><button class="yes" id="yes">Es anuncio <small>(A)</small></button><button class="no" id="no">No es anuncio <small>(N)</small></button></div>
    <div class="secondary"><button id="skip" class="grow">Saltar (S)</button><button id="undo">Deshacer (U)</button><button id="repeat">Repetir audio (R)</button><button id="cut">Cortar aquí (C)</button></div>
    <section class="borders"><strong>Ajustar bordes</strong><div class="border-row"><span>Inicio</span><button data-edge="ini" data-delta="-1">−1 s</button><button data-edge="ini" data-delta="1">+1 s</button></div><div class="border-row"><span>Final</span><button data-edge="fin" data-delta="-1">−1 s</button><button data-edge="fin" data-delta="1">+1 s</button></div></section>
  </article></main>
  <script>
  (()=>{'use strict';const $=s=>document.querySelector(s);let queue=[],current=null,initial=0,done=0,skipped=0;
  function esc(x){const e=document.createElement('span');e.textContent=x;return e.innerHTML} function time(t){return new Date(t*1000).toLocaleString()} function api(url,opt){return fetch(url,opt).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.detail||'Error de comunicación');return d})}
  function stats(s){$('#ads').textContent=s.anuncios;$('#noads').textContent=s.no_anuncios;$('#pending').textContent=s.pendientes}
  function render(){current=queue[0];if(!current){$('#card').classList.add('hidden');$('#empty').classList.remove('hidden');$('#empty').innerHTML=initial?`Tanda terminada.<br>Etiquetados: ${done}. Saltados: ${skipped}.`:'No hay tramos pendientes.';return}$('#empty').classList.add('hidden');$('#card').classList.remove('hidden');$('#progress').textContent=`Tanda: ${Math.min(initial,done+skipped+1)} / ${initial}`;const score=current.score==null?'sin score':Number(current.score).toFixed(3);$('#meta').innerHTML=`<div><small>Hora</small>${esc(time(current.ini))}</div><div><small>Duración</small>${(current.fin-current.ini).toFixed(1)} s</div><div><small>Origen</small>${esc({repeat:'repetición',muestra:'al azar'}[current.source]||'modelo')}</div><div><small>Repeticiones</small>${current.n_repeats}</div><div><small>Score</small>${score}</div>`;const p=$('#propagate');p.checked=!!current.group_key&&current.group_total>1;p.disabled=!p.checked;$('#audio').src=`/api/audio/${current.id}?ini=${encodeURIComponent(current.ini)}&fin=${encodeURIComponent(current.fin)}&v=${Date.now()}`;const total=current.fin-current.ini+6;$('#real').style.left=`${300/total}%`;$('#real').style.width=`${100*(current.fin-current.ini)/total}%`;cuts()}
  const M=3;function mmss(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
  function cuts(){const c=current;if(!c)return;c.cortes=c.cortes||[];const total=c.fin-c.ini+2*M,pos=t=>100*(t-c.ini+M)/total;const tl=$('#timeline');tl.querySelectorAll('.cut').forEach(x=>x.remove());$('#tr').style.left=pos(c.ini)+'%';$('#tr').style.width=(100*(c.fin-c.ini)/total)+'%';c.cortes.forEach(t=>{const b=document.createElement('button');b.className='cut';b.style.left=pos(t)+'%';b.title='Quitar corte en '+mmss(t-c.ini);b.onclick=()=>delCut(t);tl.appendChild(b)});const pts=[c.ini,...c.cortes,c.fin];const box=$('#subs');box.innerHTML='';if(c.cortes.length===0)return;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],d=document.createElement('div');d.className='sub';d.innerHTML=`<span>Cuña ${i+1}: ${mmss(a-c.ini)}–${mmss(b-c.ini)} (${Math.round(b-a)} s)</span>`;const bt=document.createElement('button');bt.textContent='Reproducir';bt.onclick=()=>{const au=$('#audio');au.currentTime=a-c.ini+M;au.play();const stop=()=>{if(au.currentTime>=b-c.ini+M){au.pause();au.removeEventListener('timeupdate',stop)}};au.addEventListener('timeupdate',stop)};d.appendChild(bt);box.appendChild(d)}}
  async function cut(){if(!current)return;const t=current.ini-M+$('#audio').currentTime;if(t<=current.ini||t>=current.fin){alert('El corte debe quedar dentro del tramo (marca azul).');return}try{const d=await api('/api/cortes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment_id:current.id,t})});current.cortes=d.cortes;cuts()}catch(e){alert(e.message)}}
  async function delCut(t){try{const d=await api('/api/cortes',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment_id:current.id,t})});current.cortes=d.cortes;cuts()}catch(e){alert(e.message)}}
  async function load(){try{const d=await api('/api/tanda?n=20');queue=d.tramos;initial=queue.length;done=skipped=0;stats(d.stats);render()}catch(e){$('#empty').textContent=e.message}}
  async function label(n){if(!current)return;try{const d=await api('/api/etiqueta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment_id:current.id,etiqueta:n,propagar:$('#propagate').checked})});const ids=new Set(d.afectados);queue=queue.filter(x=>!ids.has(x.id));done+=ids.size;stats(d.stats);render()}catch(e){alert(e.message)}}
  function skip(){if(current){queue.shift();skipped++;render()}} async function undo(){try{const d=await api('/api/deshacer',{method:'POST'});stats(d.stats);if(d.cortes&&current){current.cortes=d.cortes;cuts()}else await load()}catch(e){alert(e.message)}} async function border(edge,delta){if(!current)return;const next={ini:current.ini,fin:current.fin};next[edge]+=delta;if(next.ini>=next.fin){alert('El inicio debe ser anterior al final.');return}try{const r=await api('/api/bordes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment_id:current.id,...next})});Object.assign(current,next);if(r.descartados&&r.descartados.length){current.cortes=(current.cortes||[]).filter(t=>!r.descartados.some(x=>Math.abs(x-t)<0.01));alert('Se descartaron '+r.descartados.length+' corte(s) que quedaron fuera del tramo.')}render()}catch(e){alert(e.message)}}
  $('#yes').onclick=()=>label(1);$('#no').onclick=()=>label(0);$('#skip').onclick=skip;$('#undo').onclick=undo;$('#repeat').onclick=()=>{$('#audio').currentTime=0;$('#audio').play()};$('#cut').onclick=cut;$('#new').onclick=load;document.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>border(b.dataset.edge,Number(b.dataset.delta)));document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(k==='a')label(1);if(k==='n')label(0);if(k==='s')skip();if(k==='u')undo();if(k==='c')cut();if(k==='r'){$('#repeat').click()} });load();})();
  </script>
</body></html>

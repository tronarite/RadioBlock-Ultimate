<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Ad Blocker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Radio Ad Blocker</h1>
  <span class="muted" id="ws-indicator">conectando…</span>
</header>

<main>
  <div class="card">
    <div class="stat-grid" id="global-stats">
      <div class="stat"><div class="value">—</div><div class="label">emisoras añadidas</div></div>
      <div class="stat"><div class="value">—</div><div class="label">min. analizados</div></div>
      <div class="stat"><div class="value">—</div><div class="label">min. de anuncios silenciados</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Emisoras</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Ahora</th>
          <th>Patrones nuevos</th>
          <th>Proxy</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="radios-body">
        <tr><td colspan="6" class="empty">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<button class="fab" id="fab-add" onclick="abrirAñadir()" title="Añadir emisora">+</button>

<div class="modal-overlay" id="add-radio-overlay" style="display:none;" onclick="if(event.target===this) cerrarAñadir()">
  <div class="card modal-card">
    <h2>Añadir emisora</h2>
    <form id="new-radio-form">
      <div class="field"><label>Nombre</label><input name="nombre" placeholder="p.ej. Cadena SER" required></div>
      <div class="field"><label>URL del stream</label><input name="url" placeholder="http://..." required></div>
      <div class="field"><label>Descripción (opcional)</label><input name="descripcion" placeholder=""></div>
      <div class="row" style="justify-content:flex-end; margin-top:0.75rem;">
        <button type="button" class="secondary" onclick="cerrarAñadir()">Cancelar</button>
        <button type="submit">Añadir</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
